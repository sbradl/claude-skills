# Publish a GitHub release when a version tag is pushed.
# Release:  mise run release v2.2.0   (release commit + tag + push)
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # CHANGELOG.md is generated; a stale copy means the hook was bypassed.
      - name: Check CHANGELOG.md matches CHANGELOG.json
        run: sh skills/commit/commit/render.sh | diff -u CHANGELOG.md -

      # The tag must sit on a release commit (scripts/release.sh), so the
      # changelog already records this version when the release goes out.
      - name: Check CHANGELOG.json records this release
        run: |
          jq -e --arg v "$GITHUB_REF_NAME" 'any(.releases[]; .version == $v)' CHANGELOG.json >/dev/null \
            || { echo "::error::CHANGELOG.json has no $GITHUB_REF_NAME release — tag with mise run release"; exit 1; }

      - name: Render release notes
        run: |
          sh skills/commit/commit/render.sh -r "$GITHUB_REF_NAME" > notes.md
          [ -s notes.md ] || echo "No user-facing changes." > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
