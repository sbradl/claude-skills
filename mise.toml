[tools]
jq = "1.8.2"
gh = "2.102.0"

[tasks.setup]
description = "Install tools and enable the repo's git hooks"
run = [
  "mise install",
  "git config core.hooksPath .githooks",
]

[tasks.check]
description = "Check the skill conventions and check-coverage.sh"
run = "sh scripts/check-skills.sh"

[tasks.changelog]
description = "Regenerate CHANGELOG.md from CHANGELOG.json"
run = "sh skills/commit/commit/render.sh > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md"

[tasks.release]
description = "Cut a release: scripts/release.sh v<major>.<minor>.<patch>"
run = "scripts/release.sh"
